name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          unzip -q -o AYANXD.zip -d _x
          shopt -s dotglob
          cp -r _x/ayan-xd/* .
          rm -rf _x AYANXD.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract bot files"
          git push
