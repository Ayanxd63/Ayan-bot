name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          shopt -s nullglob dotglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No .zip file in repo root. Files here:"; ls -la; exit 1
          fi
          zip="${zips[0]}"
          echo "Using $zip"
          unzip -q -o "$zip" -d _x
          src=_x
          [ -d _x/ayan-xd ] && src=_x/ayan-xd
          cp -r "$src"/* .
          rm -rf _x "$zip"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract bot files"
          git push
